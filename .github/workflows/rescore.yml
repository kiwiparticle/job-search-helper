name: rescore

run-name: rescore

on:
  workflow_dispatch: {}

concurrency: { group: rescore, cancel-in-progress: false }

# Three jobs, like fill.yml. Only prepare and finish hold the Cloudflare token; the model job holds no token.
# Dispatched from the page (Re-check). Prepare lists saved and flagged jobs with their companies' stored notes; with none, the model never runs.
# Finish saves each job's new fit and its company's new fingerprint in one D1 batch (lib/rescore.js).

jobs:
  prepare:
    if: >-
      vars.JOB_SEARCH_ENABLED == 'true'
    runs-on: self-hosted
    timeout-minutes: 10
    permissions: { contents: read, actions: read }
    outputs:
      model: ${{ steps.p.outputs.model }}
      count: ${{ steps.p.outputs.count }}
      at: ${{ steps.p.outputs.at }}
    env:
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: core.hooksPath
      GIT_CONFIG_VALUE_0: /dev/null
      GIT_CONFIG_KEY_1: core.fsmonitor
      GIT_CONFIG_VALUE_1: 'false'
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_CONFIG_NOSYSTEM: '1'
    steps:
      - name: Clean workspace
        run: |
          [ -L "$GITHUB_WORKSPACE" ] && { echo "workspace is a symlink"; exit 1; }
          chmod -R u+rwX "$GITHUB_WORKSPACE" 2>/dev/null || true
          find "$GITHUB_WORKSPACE" -mindepth 1 -delete
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - id: p
        name: Prepare
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
        run: |
          # The workflow's creation time names the run, so a retried finish records nothing twice.
          at=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)
          [ -n "$at" ] || { echo "no run creation time"; exit 1; }
          echo "at=$at" >> "$GITHUB_OUTPUT"
          node bin/rescore-prepare.js "$RUNNER_TEMP/ctx" >> "$GITHUB_OUTPUT"
      - name: Check model
        env:
          MODEL: ${{ steps.p.outputs.model }}
        run: |
          node bin/model-info.js "$MODEL" > /dev/null || { echo "unknown or disabled model"; exit 1; }
      - uses: actions/upload-artifact@v7
        with: { name: rescore-ctx, path: '${{ runner.temp }}/ctx', include-hidden-files: true, if-no-files-found: error }

  model:
    # The page's Status bar reads `run (<ids>)` to say which model is working (StatusBar.tsx).
    name: "run (${{ needs.prepare.outputs.model }})"
    needs: prepare
    if: >-
      vars.JOB_SEARCH_ENABLED == 'true' && (needs.prepare.outputs.count != '0')
    runs-on: self-hosted
    timeout-minutes: 110
    permissions: { contents: read }
    steps:
      - name: Clean workspace
        run: |
          [ -L "$GITHUB_WORKSPACE" ] && { echo "workspace is a symlink"; exit 1; }
          chmod -R u+rwX "$GITHUB_WORKSPACE" 2>/dev/null || true
          find "$GITHUB_WORKSPACE" -mindepth 1 -delete
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/download-artifact@v8
        with: { name: rescore-ctx, path: '${{ runner.temp }}/ctx' }
      - name: Re-score jobs
        env:
          MODEL: ${{ needs.prepare.outputs.model }}
        run: |
          # Wrapped so bash has parsed the whole step before the model starts; the step script sits in a folder the model can write.
          rescore_main() {
          cp bin/collect-output.sh "$RUNNER_TEMP/collect-output.sh"; chmod 555 "$RUNNER_TEMP/collect-output.sh"
          NO_WEB=1 bin/run-model.sh "$MODEL" prompts/rescore.md "$RUNNER_TEMP/ctx"
          /usr/bin/env -i /bin/bash "$RUNNER_TEMP/collect-output.sh" "$RUNNER_TEMP/ctx" "$RUNNER_TEMP/out" rescore.json status.txt || true
          }
          rescore_main; exit
      - uses: actions/upload-artifact@v7
        with: { name: rescore-out, path: '${{ runner.temp }}/out', include-hidden-files: true, if-no-files-found: error }

  finish:
    needs: [prepare, model]
    if: >-
      !cancelled() && vars.JOB_SEARCH_ENABLED == 'true' && (needs.prepare.result == 'success' && needs.model.result == 'success')
    runs-on: self-hosted
    timeout-minutes: 15
    permissions: { contents: read }
    env:
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: core.hooksPath
      GIT_CONFIG_VALUE_0: /dev/null
      GIT_CONFIG_KEY_1: core.fsmonitor
      GIT_CONFIG_VALUE_1: 'false'
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_CONFIG_NOSYSTEM: '1'
    steps:
      - name: Clean workspace
        run: |
          [ -L "$GITHUB_WORKSPACE" ] && { echo "workspace is a symlink"; exit 1; }
          chmod -R u+rwX "$GITHUB_WORKSPACE" 2>/dev/null || true
          find "$GITHUB_WORKSPACE" -mindepth 1 -delete
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      # context.json comes only from prepare's artifact; the model's artifact goes to raw/ and is filtered below.
      - uses: actions/download-artifact@v8
        with: { name: rescore-ctx, path: '${{ runner.temp }}/ctx' }
      - uses: actions/download-artifact@v8
        with: { name: rescore-out, path: '${{ runner.temp }}/raw' }
      - name: Save scores
        env:
          RESCORE_AT: ${{ needs.prepare.outputs.at }}
          MODEL: ${{ needs.prepare.outputs.model }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
        run: |
          /usr/bin/env -i /bin/bash bin/collect-output.sh "$RUNNER_TEMP/raw" "$RUNNER_TEMP/fin" rescore.json status.txt || true
          node bin/rescore-finish.js "$RUNNER_TEMP/fin" "$RUNNER_TEMP/ctx"
