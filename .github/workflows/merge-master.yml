name: merge-master

on:
  workflow_dispatch:
    inputs:
      id: { required: true, description: 'Supplemental fact to add to master-resume.md' }

# Script only, no model. Adds one line under a heading the owner listed in data/master-sections.json, commits it, then marks the fact merged.
jobs:
  merge:
    if: >-
      vars.JOB_SEARCH_ENABLED == 'true'
    runs-on: self-hosted
    timeout-minutes: 15
    permissions: { contents: write }
    env:
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: core.hooksPath
      GIT_CONFIG_VALUE_0: /dev/null
      GIT_CONFIG_KEY_1: core.fsmonitor
      GIT_CONFIG_VALUE_1: 'false'
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_CONFIG_NOSYSTEM: '1'
    steps:
      - name: Clean workspace
        run: |
          [ -L "$GITHUB_WORKSPACE" ] && { echo "workspace is a symlink"; exit 1; }
          chmod -R u+rwX "$GITHUB_WORKSPACE" 2>/dev/null || true
          find "$GITHUB_WORKSPACE" -mindepth 1 -delete
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - name: Add the line, push, then mark it merged
        env:
          GH_TOKEN: '${{ github.token }}'
          FACT_ID: ${{ inputs.id }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
        run: |
          [[ "$FACT_ID" =~ ^[0-9a-f-]{36}$ ]] || { echo "bad id"; exit 1; }
          git config user.name "job-search bot"
          git config user.email "actions@users.noreply.github.com"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # If main moved meanwhile, reset to it and add the line again on top (the edit skips a line already there).
          ok=0
          for i in 1 2 3 4; do
            node bin/merge-master.js edit "$FACT_ID"
            if git diff --quiet master-resume.md; then ok=1; break; fi
            git add master-resume.md
            git commit -qm "master: add an owner-supplied fact"
            if git push -q "$remote" HEAD:main; then ok=1; break; fi
            git fetch -q "$remote" main || { sleep $((i * 5)); continue; }
            git reset -q --hard FETCH_HEAD
            sleep $((i * 5))
          done
          [ "$ok" = 1 ] || { echo "could not push the master change"; exit 1; }
          node bin/merge-master.js mark "$FACT_ID"
