name: recover-dropped

run-name: recover dropped companies

# By hand only: adds the companies and finds earlier runs dropped for the new-company limit. Once per run.
on:
  workflow_dispatch:
    inputs:
      runs:
        description: Run folders, space separated (runs/2026-11-21-culture-195056). Empty = every run that dropped some
        required: false

jobs:
  recover:
    if: >-
      vars.JOB_SEARCH_ENABLED == 'true'
    runs-on: self-hosted
    timeout-minutes: 15
    permissions: { contents: read }
    env:
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: core.hooksPath
      GIT_CONFIG_VALUE_0: /dev/null
      GIT_CONFIG_KEY_1: core.fsmonitor
      GIT_CONFIG_VALUE_1: 'false'
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_CONFIG_NOSYSTEM: '1'
    steps:
      - name: Clean workspace
        run: |
          [ -L "$GITHUB_WORKSPACE" ] && { echo "workspace is a symlink"; exit 1; }
          chmod -R u+rwX "$GITHUB_WORKSPACE" 2>/dev/null || true
          find "$GITHUB_WORKSPACE" -mindepth 1 -delete
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - name: Recover
        env:
          RUNS: ${{ inputs.runs }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
        run: |
          for r in $RUNS; do case "$r" in runs/[0-9]*) ;; *) echo "bad run folder: $r"; exit 1 ;; esac; done
          node bin/recover-dropped.js $RUNS
